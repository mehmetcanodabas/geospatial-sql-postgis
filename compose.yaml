
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geospatial-postgis
    environment:
      POSTGRES_USER: geo_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: geospatial
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
